# yaml-language-server: $schema=https://aka.ms/configuration-dsc-schema/0.2
#
# Windows 環境セットアップ用 WinGet 構成ファイル（WinGet Configuration schema 0.2）
#
# 適用方法:
#   winget configure -f "$(chezmoi source-path)\reference\windows\configuration.dsc.yaml"
#
# 注意:
#   - パッケージ一覧は現在の WinGet エクスポートとの差分を減らすため、必要に応じて
#     依存ランタイムや Store パッケージも明示的に列挙する
#   - Microsoft.Office はベースライン同期のため WinGet DSC に含める。
#     追加の Office 構成は reference/windows/office-config.xml の ODT で調整する
#   - Microsoft Store 由来のアプリは source: msstore で管理する
#   - GoLang.Go / Rustlang.Rust.MSVC / Volta.Volta はエクスポート済みの
#     開発環境ベースラインに合わせて有効化している
#   - Windows オプション機能（OpenSSH, Hyper-V, 開発者モード）は PSDscResources/Script で管理
#   - フォントは JetBrains Mono Nerd Font を winget、他は GitHub Releases から管理

properties:
  configurationVersion: 0.2.0
  assertions:
    - resource: PSDscResources/Script
      id: assert-windows11
      directives:
        description: Windows 11 以上であることを確認
      settings:
        GetScript: |
          return @{ Result = [System.Environment]::OSVersion.Version.ToString() }
        TestScript: |
          $v = [System.Environment]::OSVersion.Version
          return ($v.Major -gt 10) -or ($v.Major -eq 10 -and $v.Build -ge 22000)
        SetScript: |
          throw "Windows 11 以上が必要です。"

  resources:

    # -------------------------------------------------------------------------
    # シェル・ターミナル
    # -------------------------------------------------------------------------
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: powershell
      directives:
        description: PowerShell 7
      settings:
        id: Microsoft.PowerShell
        source: winget

    - resource: PSDscResources/Script
      id: powershell-modules
      directives:
        description: PowerShell modules (Az, Microsoft Entra, Microsoft Graph)
      settings:
        GetScript: |
          function Resolve-PwshPath {
            $candidates = @(
              (Join-Path $env:ProgramFiles 'PowerShell\7\pwsh.exe'),
              (Join-Path ${env:ProgramFiles(x86)} 'PowerShell\7\pwsh.exe')
            )

            foreach ($candidate in $candidates) {
              if ($candidate -and (Test-Path $candidate)) {
                return $candidate
              }
            }

            return (Get-Command pwsh.exe -ErrorAction SilentlyContinue).Source
          }

          $pwsh = Resolve-PwshPath
          if (-not $pwsh) {
            return @{ Result = 'pwsh-not-installed' }
          }

          $installed = & $pwsh -NoLogo -NoProfile -Command '
            $modules = @("Az", "Microsoft.Entra", "Microsoft.Graph")
            ($modules | Where-Object { Get-Module -ListAvailable -Name $_ }).Count
          '
          return @{ Result = "$installed/3" }
        TestScript: |
          function Resolve-PwshPath {
            $candidates = @(
              (Join-Path $env:ProgramFiles 'PowerShell\7\pwsh.exe'),
              (Join-Path ${env:ProgramFiles(x86)} 'PowerShell\7\pwsh.exe')
            )

            foreach ($candidate in $candidates) {
              if ($candidate -and (Test-Path $candidate)) {
                return $candidate
              }
            }

            return (Get-Command pwsh.exe -ErrorAction SilentlyContinue).Source
          }

          $pwsh = Resolve-PwshPath
          if (-not $pwsh) {
            return $false
          }

          & $pwsh -NoLogo -NoProfile -Command '
            $modules = @("Az", "Microsoft.Entra", "Microsoft.Graph")
            foreach ($name in $modules) {
              if (-not (Get-Module -ListAvailable -Name $name)) {
                exit 1
              }
            }
          '
          return $LASTEXITCODE -eq 0
        SetScript: |
          function Resolve-PwshPath {
            $candidates = @(
              (Join-Path $env:ProgramFiles 'PowerShell\7\pwsh.exe'),
              (Join-Path ${env:ProgramFiles(x86)} 'PowerShell\7\pwsh.exe')
            )

            foreach ($candidate in $candidates) {
              if ($candidate -and (Test-Path $candidate)) {
                return $candidate
              }
            }

            return (Get-Command pwsh.exe -ErrorAction SilentlyContinue).Source
          }

          $pwsh = Resolve-PwshPath
          if (-not $pwsh) {
            throw 'pwsh.exe was not found after installing PowerShell 7.'
          }

          $moduleInstallScript = @'
          $ErrorActionPreference = "Stop"

          $psGallery = Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue
          $previousInstallationPolicy = $null

          if ($psGallery) {
            $previousInstallationPolicy = $psGallery.InstallationPolicy
          }

          $modules = @(
            "Az",
            "Microsoft.Entra",
            "Microsoft.Graph"
          )

          try {
            if ($psGallery -and $previousInstallationPolicy -ne "Trusted") {
              Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
            }

            foreach ($name in $modules) {
              if (Get-Module -ListAvailable -Name $name) {
                continue
              }

              Install-Module -Name $name -Repository PSGallery -Scope CurrentUser -Force -AllowClobber
            }
          }
          finally {
            if ($psGallery -and $previousInstallationPolicy -and $previousInstallationPolicy -ne "Trusted") {
              Set-PSRepository -Name PSGallery -InstallationPolicy $previousInstallationPolicy
            }
          }
          '@

          & $pwsh -NoLogo -NoProfile -Command $moduleInstallScript

