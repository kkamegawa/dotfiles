      settings:
        id: DEVCOM.JetBrainsMonoNerdFont
        source: winget

    # winget 非対応フォント（GitHub Releases から取得）
    - resource: PSDscResources/Script
      id: font-monaspace
      directives:
        description: Monaspace（GitHub Next 製モノスペースフォント群）
        securityContext: elevated
      settings:
        GetScript: |
          $fontDir = "$env:LOCALAPPDATA\Microsoft\Windows\Fonts"
          $installed = Test-Path "$fontDir\MonaspaceNeon-Regular.otf"
          return @{ Result = "$installed" }
        TestScript: |
          $fontDir = "$env:LOCALAPPDATA\Microsoft\Windows\Fonts"
          return (Test-Path "$fontDir\MonaspaceNeon-Regular.otf")
        SetScript: |
          $tmp = Join-Path $env:TEMP "monaspace"
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          $tag = (Invoke-RestMethod "https://api.github.com/repos/githubnext/monaspace/releases/latest").tag_name
          $zip = Join-Path $tmp "monaspace.zip"
          Invoke-WebRequest `
            -Uri "https://github.com/githubnext/monaspace/releases/download/$tag/monaspace-$tag.zip" `
            -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $tmp -Force
          $fontDir = "$env:LOCALAPPDATA\Microsoft\Windows\Fonts"
          New-Item -ItemType Directory -Force -Path $fontDir | Out-Null
          Get-ChildItem -Path "$tmp\monaspace-$tag\fonts\otf" -Filter "*.otf" | ForEach-Object {
            Copy-Item $_.FullName -Destination $fontDir -Force
          }
          Remove-Item -Recurse -Force $tmp

    - resource: PSDscResources/Script
      id: font-plemonjp-console-nf
      directives:
        description: PlemolJP Console NF（プログラミング向け日本語フォント、Nerd Fonts パッチ済み）
        securityContext: elevated
      settings:
        GetScript: |
          $fontDir = "$env:LOCALAPPDATA\Microsoft\Windows\Fonts"
          $installed = Test-Path "$fontDir\PlemolJPConsoleNF-Regular.ttf"
          return @{ Result = "$installed" }
        TestScript: |
          $fontDir = "$env:LOCALAPPDATA\Microsoft\Windows\Fonts"
          return (Test-Path "$fontDir\PlemolJPConsoleNF-Regular.ttf")
        SetScript: |
          $tmp = Join-Path $env:TEMP "plemonjp"
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          $release = Invoke-RestMethod "https://api.github.com/repos/yuru7/PlemolJP/releases/latest"
          $asset = $release.assets |
            Where-Object { $_.name -match "PlemolJP_Console_NF_.*\.zip" } |
            Select-Object -First 1
          $zip = Join-Path $tmp "plemonjp.zip"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $tmp -Force
          $fontDir = "$env:LOCALAPPDATA\Microsoft\Windows\Fonts"
          New-Item -ItemType Directory -Force -Path $fontDir | Out-Null
          Get-ChildItem -Path $tmp -Recurse -Filter "*.ttf" | ForEach-Object {
            Copy-Item $_.FullName -Destination $fontDir -Force
          }
          Remove-Item -Recurse -Force $tmp

    - resource: PSDscResources/Script
      id: font-noto-sans-jp
      directives:
        description: Noto Sans JP（Google 製の日本語フォント）
        securityContext: elevated
      settings:
        GetScript: |
          $fontDir = "$env:LOCALAPPDATA\Microsoft\Windows\Fonts"
          $installed = Test-Path "$fontDir\NotoSansJP-Regular.ttf"
          return @{ Result = "$installed" }
        TestScript: |
          $fontDir = "$env:LOCALAPPDATA\Microsoft\Windows\Fonts"
          return (Test-Path "$fontDir\NotoSansJP-Regular.ttf")
        SetScript: |
          $tmp = Join-Path $env:TEMP "notosansjp"
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          # Google Fonts の Noto Sans JP は GitHub にミラーあり
          $release = Invoke-RestMethod "https://api.github.com/repos/notofonts/japanese/releases/latest"
          $asset = $release.assets | Where-Object { $_.name -match "NotoSansJP.*\.zip" } | Select-Object -First 1
          $zip = Join-Path $tmp "notosansjp.zip"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $tmp -Force
          $fontDir = "$env:LOCALAPPDATA\Microsoft\Windows\Fonts"
          New-Item -ItemType Directory -Force -Path $fontDir | Out-Null
          Get-ChildItem -Path $tmp -Recurse -Filter "NotoSansJP-*.ttf" | ForEach-Object {
            Copy-Item $_.FullName -Destination $fontDir -Force
          }
          Remove-Item -Recurse -Force $tmp

    # -------------------------------------------------------------------------
    # Windows オプション機能（補足）
    # -------------------------------------------------------------------------
    # 上記 Script リソースで主要機能（OpenSSH, Hyper-V, 開発者モード）をカバー済み。
    # VirtualMachinePlatform（WSL 2 向け）等が必要な場合は同パターンで追加する

    # -------------------------------------------------------------------------
    # Office アプリ設定（参考）
    # -------------------------------------------------------------------------
    # Microsoft.Office はエクスポート済みベースラインとの整合のため DSC で導入する。
    # アプリ構成の詳細なカスタマイズが必要な場合は
    # reference/windows/office-config.xml の ODT 設定を併用する。

    # -------------------------------------------------------------------------
    # 追加の開発ツール
    # -------------------------------------------------------------------------
    # Go / Rust はエクスポート済みベースラインと合わせて有効化している
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: golang
      directives:
        description: Go 言語
      settings:
        id: GoLang.Go
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: rust-msvc
      directives:
        description: Rust（MSVC ツールチェーン）
      settings:
        id: Rustlang.Rust.MSVC
        source: winget
