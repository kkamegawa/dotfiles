    # -------------------------------------------------------------------------
    # Windows オプション機能
    # -------------------------------------------------------------------------
    # 注意: PSDscResources の WindowsOptionalFeature は Windows Server 向けのため
    #       クライアント OS では DISM PowerShell モジュール経由で管理する
    - resource: PSDscResources/Script
      id: enable-openssh-client
      directives:
        description: OpenSSH クライアントを有効化
        securityContext: elevated
      settings:
        GetScript: |
          $state = Get-WindowsOptionalFeature -Online -FeatureName OpenSSH.Client
          return @{ Result = $state.State }
        TestScript: |
          $state = Get-WindowsOptionalFeature -Online -FeatureName OpenSSH.Client
          return $state.State -eq 'Enabled'
        SetScript: |
          Enable-WindowsOptionalFeature -Online -FeatureName OpenSSH.Client -NoRestart

    - resource: PSDscResources/Script
      id: enable-hyperv
      directives:
        description: Hyper-V を有効化
        securityContext: elevated
      settings:
        GetScript: |
          $state = Get-WindowsOptionalFeature -Online -FeatureName Microsoft-Hyper-V-All
          return @{ Result = $state.State }
        TestScript: |
          $state = Get-WindowsOptionalFeature -Online -FeatureName Microsoft-Hyper-V-All
          return $state.State -eq 'Enabled'
        SetScript: |
          Enable-WindowsOptionalFeature -Online -FeatureName Microsoft-Hyper-V-All -NoRestart

    - resource: PSDscResources/Script
      id: enable-developer-mode
      directives:
        description: 開発者モードを有効化
        securityContext: elevated
      settings:
        GetScript: |
          $val = Get-ItemPropertyValue `
            -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock' `
            -Name AllowDevelopmentWithoutDevLicense `
            -ErrorAction SilentlyContinue
          return @{ Result = "$val" }
        TestScript: |
          $val = Get-ItemPropertyValue `
            -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock' `
            -Name AllowDevelopmentWithoutDevLicense `
            -ErrorAction SilentlyContinue
          return $val -eq 1
        SetScript: |
          $regPath = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock'
          if (-not (Test-Path $regPath)) { New-Item -Path $regPath -Force | Out-Null }
          Set-ItemProperty -Path $regPath -Name AllowDevelopmentWithoutDevLicense -Value 1 -Type DWord

    # -------------------------------------------------------------------------
    # フォント
    # -------------------------------------------------------------------------
    # winget 対応フォント
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: font-jetbrains-mono-nf
