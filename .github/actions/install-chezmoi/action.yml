name: Install chezmoi
description: Build and install chezmoi from its pinned source tag
runs:
  using: composite
  steps:
    - uses: actions/checkout@v4.4.0
      with:
        repository: twpayne/chezmoi
        ref: v2.74.0
        path: chezmoi-src
    - uses: actions/setup-go@v7.0.0
      with:
        go-version-file: chezmoi-src/go.mod
        cache-dependency-path: chezmoi-src/go.mod
    - name: Build and verify chezmoi (Linux and macOS)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        bin_dir="$RUNNER_TEMP/chezmoi-bin"
        mkdir -p "$bin_dir"
        (cd "$GITHUB_WORKSPACE/chezmoi-src" && go build -o "$bin_dir/chezmoi" .)
        test -x "$bin_dir/chezmoi"
        "$bin_dir/chezmoi" --version
        echo "$bin_dir" >> "$GITHUB_PATH"
    - name: Build and verify chezmoi (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $binDir = Join-Path $env:RUNNER_TEMP 'chezmoi-bin'
        New-Item -ItemType Directory -Force -Path $binDir | Out-Null
        $sourceDir = Join-Path $env:GITHUB_WORKSPACE 'chezmoi-src'
        Push-Location $sourceDir
        try {
          go build -o (Join-Path $binDir 'chezmoi.exe') .
          $buildExitCode = $LASTEXITCODE
        } finally {
          Pop-Location
        }
        if ($buildExitCode -ne 0) {
          throw "go build failed with exit code $buildExitCode."
        }
        $chezmoi = Join-Path $binDir 'chezmoi.exe'
        if (!(Test-Path -LiteralPath $chezmoi -PathType Leaf)) {
          throw "chezmoi.exe was not found in $binDir."
        }
        & $chezmoi --version
        if ($LASTEXITCODE -ne 0) {
          throw "chezmoi version check failed with exit code $LASTEXITCODE."
        }
        $binDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
    - name: Remove nested chezmoi checkout (Linux and macOS)
      if: runner.os != 'Windows'
      shell: bash
      run: rm -rf -- "$GITHUB_WORKSPACE/chezmoi-src"
    - name: Remove nested chezmoi checkout (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: Remove-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'chezmoi-src') -Recurse -Force
