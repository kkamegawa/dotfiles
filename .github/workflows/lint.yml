name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        shell: bash
        run: |
          mapfile -d '' shell_scripts < <(git ls-files -z '*.sh')
          if ((${#shell_scripts[@]})); then
            shellcheck --severity=warning --format=gcc "${shell_scripts[@]}"
          fi

  psscriptanalyzer:
    name: PSScriptAnalyzer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $results = Get-ChildItem -Recurse -Filter '*.ps1' |
            Invoke-ScriptAnalyzer -Severity Warning,Error
          if ($results) {
            $results | Format-Table -AutoSize
            exit 1
          }
          Write-Host "PSScriptAnalyzer: 問題なし"

  yamllint:
    name: yamllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run yamllint
        uses: ibiqlik/action-yamllint@v3
        with:
          config_data: |
            extends: default
            rules:
              line-length:
                max: 120
              comments:
                min-spaces-from-content: 1

  chezmoi-dry-run-linux:
    name: chezmoi dry-run (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install chezmoi
        run: |
          installer="$RUNNER_TEMP/chezmoi-install.sh"
          downloaded=false
          for attempt in 1 2 3 4; do
            rm -f "$installer"
            if curl --fail --location --silent --show-error \
              --retry 5 --retry-all-errors --retry-delay 2 --retry-max-time 120 \
              https://raw.githubusercontent.com/twpayne/chezmoi/v2.74.0/assets/scripts/install.sh \
              --output "$installer" \
              && test -s "$installer"; then
              downloaded=true
              break
            fi
            rm -f "$installer"
            if [ "$attempt" -lt 4 ]; then
              delay=$((attempt * 2))
              echo "chezmoi bootstrap download attempt $attempt failed; retrying in ${delay}s" >&2
              sleep "$delay"
            fi
          done
          if [ "$downloaded" != true ]; then
            echo "chezmoi bootstrap script was not downloaded after 4 attempts" >&2
            exit 1
          fi
          binary="$HOME/.local/bin/chezmoi"
          installed=false
          for attempt in 1 2 3 4 5 6; do
            if sh "$installer" -t v2.74.0 -b "$HOME/.local/bin" \
              && test -x "$binary" \
              && "$binary" --version >/dev/null 2>&1; then
              installed=true
              break
            fi
            if [ "$attempt" -lt 6 ]; then
              delay=$((attempt * 2))
              if [ "$delay" -gt 30 ]; then delay=30; fi
              echo "chezmoi install attempt $attempt failed; retrying in ${delay}s" >&2
              sleep "$delay"
            fi
          done
          if [ "$installed" != true ]; then
            echo "chezmoi was not installed after 6 attempts" >&2
            exit 1
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: chezmoi dry-run (Linux)
        run: |
          dest="$RUNNER_TEMP/chezmoi-home"
          config="$dest/.config/chezmoi/chezmoi.toml"
          mkdir -p "$(dirname "$config")"
          chezmoi init \
            --source "$GITHUB_WORKSPACE" \
            --config-path "$config" \
            --destination "$dest" \
            --apply \
            --dry-run \
            --verbose \
            --no-tty

  chezmoi-dry-run-macos:
    name: chezmoi dry-run (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install chezmoi
        run: |
          installer="$RUNNER_TEMP/chezmoi-install.sh"
          downloaded=false
          for attempt in 1 2 3 4; do
            rm -f "$installer"
            if curl --fail --location --silent --show-error \
              --retry 5 --retry-all-errors --retry-delay 2 --retry-max-time 120 \
              https://raw.githubusercontent.com/twpayne/chezmoi/v2.74.0/assets/scripts/install.sh \
              --output "$installer" \
              && test -s "$installer"; then
              downloaded=true
              break
            fi
            rm -f "$installer"
            if [ "$attempt" -lt 4 ]; then
              delay=$((attempt * 2))
              echo "chezmoi bootstrap download attempt $attempt failed; retrying in ${delay}s" >&2
              sleep "$delay"
            fi
          done
          if [ "$downloaded" != true ]; then
            echo "chezmoi bootstrap script was not downloaded after 4 attempts" >&2
            exit 1
          fi
          binary="$HOME/.local/bin/chezmoi"
          installed=false
          for attempt in 1 2 3 4 5 6; do
            if sh "$installer" -t v2.74.0 -b "$HOME/.local/bin" \
              && test -x "$binary" \
              && "$binary" --version >/dev/null 2>&1; then
              installed=true
              break
            fi
            if [ "$attempt" -lt 6 ]; then
              delay=$((attempt * 2))
              if [ "$delay" -gt 30 ]; then delay=30; fi
              echo "chezmoi install attempt $attempt failed; retrying in ${delay}s" >&2
              sleep "$delay"
            fi
          done
          if [ "$installed" != true ]; then
            echo "chezmoi was not installed after 6 attempts" >&2
            exit 1
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: chezmoi dry-run (macOS)
        run: |
          dest="$RUNNER_TEMP/chezmoi-home"
          config="$dest/.config/chezmoi/chezmoi.toml"
          mkdir -p "$(dirname "$config")"
          chezmoi init \
            --source "$GITHUB_WORKSPACE" \
            --config-path "$config" \
            --destination "$dest" \
            --apply \
            --dry-run \
            --verbose \
            --no-tty

  chezmoi-dry-run-windows:
    name: chezmoi dry-run (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install chezmoi
        shell: pwsh
        run: |
          $binDir = Join-Path $env:RUNNER_TEMP 'chezmoi-bin'
          New-Item -ItemType Directory -Force -Path $binDir | Out-Null
          $installer = Join-Path $env:RUNNER_TEMP 'chezmoi-install.ps1'
          $uri = 'https://raw.githubusercontent.com/twpayne/chezmoi/v2.74.0/assets/scripts/install.ps1'
          $maxAttempts = 6
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            try {
              Invoke-WebRequest -Uri $uri -OutFile $installer -TimeoutSec 30 -ErrorAction Stop
              break
            } catch {
              if ($attempt -eq $maxAttempts) {
                throw
              }
              $delay = [Math]::Min(30, 2 * $attempt)
              Write-Warning "chezmoi download attempt $attempt failed; retrying in $delay seconds. $_"
              Start-Sleep -Seconds $delay
            }
          }
          if (!(Test-Path -LiteralPath $installer) -or (Get-Item -LiteralPath $installer).Length -eq 0) {
            throw 'The chezmoi installer download was empty.'
          }
          $chezmoi = Join-Path $binDir 'chezmoi.exe'
          $installed = $false
          $maxInstallAttempts = 6
          for ($attempt = 1; $attempt -le $maxInstallAttempts; $attempt++) {
            try {
              & $installer -b $binDir -Tag v2.74.0
              if ($null -ne $LASTEXITCODE -and $LASTEXITCODE -ne 0) {
                throw "chezmoi installer exited with code $LASTEXITCODE."
              }
            } catch {
              Write-Warning "chezmoi install attempt $attempt failed: $_"
            }

            if (Test-Path -LiteralPath $chezmoi -PathType Leaf) {
              try {
                & $chezmoi --version | Out-Null
                if ($LASTEXITCODE -eq 0) {
                  $installed = $true
                  break
                }
              } catch {
                Write-Warning "chezmoi binary check after attempt $attempt failed: $_"
              }
            }

            if ($attempt -lt $maxInstallAttempts) {
              $delay = [Math]::Min(30, 2 * $attempt)
              Write-Warning "chezmoi is not installed yet; retrying in $delay seconds."
              Start-Sleep -Seconds $delay
            }
          }
          if (!$installed) {
            throw "chezmoi was not installed after $maxInstallAttempts attempts."
          }
          $binDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: chezmoi dry-run (Windows)
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP 'chezmoi-home'
          $config = Join-Path $dest '.config\chezmoi\chezmoi.toml'
          New-Item -ItemType Directory -Force -Path (Split-Path $config) | Out-Null
          $chezmoiArgs = @(
            'init'
            '--source'
            "$env:GITHUB_WORKSPACE"
            '--config-path'
            "$config"
            '--destination'
            "$dest"
            '--apply'
            '--dry-run'
            '--verbose'
            '--no-tty'
          )
          chezmoi @chezmoiArgs

  winget-config-validate:
    name: winget configure validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PSDscResources
        shell: pwsh
        run: Install-Module -Name PSDscResources -Force -Scope CurrentUser
      - name: Validate WinGet configuration
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          winget configure validate `
            -f "$env:GITHUB_WORKSPACE\reference\windows\configuration.dsc.yaml" `
            --disable-interactivity `
            --verbose

  config-merge-tests:
    name: Config merge tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install chezmoi (Linux)
        if: runner.os == 'Linux'
        run: |
          installer="$RUNNER_TEMP/chezmoi-install.sh"
          downloaded=false
          for attempt in 1 2 3 4; do
            rm -f "$installer"
            if curl --fail --location --silent --show-error \
              --retry 5 --retry-all-errors --retry-delay 2 --retry-max-time 120 \
              https://raw.githubusercontent.com/twpayne/chezmoi/v2.74.0/assets/scripts/install.sh \
              --output "$installer" \
              && test -s "$installer"; then
              downloaded=true
              break
            fi
            rm -f "$installer"
            if [ "$attempt" -lt 4 ]; then
              delay=$((attempt * 2))
              echo "chezmoi bootstrap download attempt $attempt failed; retrying in ${delay}s" >&2
              sleep "$delay"
            fi
          done
          if [ "$downloaded" != true ]; then
            echo "chezmoi bootstrap script was not downloaded after 4 attempts" >&2
            exit 1
          fi
          binary="$HOME/.local/bin/chezmoi"
          installed=false
          for attempt in 1 2 3 4 5 6; do
            if sh "$installer" -t v2.74.0 -b "$HOME/.local/bin" \
              && test -x "$binary" \
              && "$binary" --version >/dev/null 2>&1; then
              installed=true
              break
            fi
            if [ "$attempt" -lt 6 ]; then
              delay=$((attempt * 2))
              if [ "$delay" -gt 30 ]; then delay=30; fi
              echo "chezmoi install attempt $attempt failed; retrying in ${delay}s" >&2
              sleep "$delay"
            fi
          done
          if [ "$installed" != true ]; then
            echo "chezmoi was not installed after 6 attempts" >&2
            exit 1
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install chezmoi (macOS)
        if: runner.os == 'macOS'
        run: |
          installer="$RUNNER_TEMP/chezmoi-install.sh"
          downloaded=false
          for attempt in 1 2 3 4; do
            rm -f "$installer"
            if curl --fail --location --silent --show-error \
              --retry 5 --retry-all-errors --retry-delay 2 --retry-max-time 120 \
              https://raw.githubusercontent.com/twpayne/chezmoi/v2.74.0/assets/scripts/install.sh \
              --output "$installer" \
              && test -s "$installer"; then
              downloaded=true
              break
            fi
            rm -f "$installer"
            if [ "$attempt" -lt 4 ]; then
              delay=$((attempt * 2))
              echo "chezmoi bootstrap download attempt $attempt failed; retrying in ${delay}s" >&2
              sleep "$delay"
            fi
          done
          if [ "$downloaded" != true ]; then
            echo "chezmoi bootstrap script was not downloaded after 4 attempts" >&2
            exit 1
          fi
          binary="$HOME/.local/bin/chezmoi"
          installed=false
          for attempt in 1 2 3 4 5 6; do
            if sh "$installer" -t v2.74.0 -b "$HOME/.local/bin" \
              && test -x "$binary" \
              && "$binary" --version >/dev/null 2>&1; then
              installed=true
              break
            fi
            if [ "$attempt" -lt 6 ]; then
              delay=$((attempt * 2))
              if [ "$delay" -gt 30 ]; then delay=30; fi
              echo "chezmoi install attempt $attempt failed; retrying in ${delay}s" >&2
              sleep "$delay"
            fi
          done
          if [ "$installed" != true ]; then
            echo "chezmoi was not installed after 6 attempts" >&2
            exit 1
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install chezmoi (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binDir = Join-Path $env:RUNNER_TEMP 'chezmoi-bin'
          New-Item -ItemType Directory -Force -Path $binDir | Out-Null
          $installer = Join-Path $env:RUNNER_TEMP 'chezmoi-install.ps1'
          $uri = 'https://raw.githubusercontent.com/twpayne/chezmoi/v2.74.0/assets/scripts/install.ps1'
          $maxAttempts = 6
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            try {
              Invoke-WebRequest -Uri $uri -OutFile $installer -TimeoutSec 30 -ErrorAction Stop
              break
            } catch {
              if ($attempt -eq $maxAttempts) {
                throw
              }
              $delay = [Math]::Min(30, 2 * $attempt)
              Write-Warning "chezmoi download attempt $attempt failed; retrying in $delay seconds. $_"
              Start-Sleep -Seconds $delay
            }
          }
          if (!(Test-Path -LiteralPath $installer) -or (Get-Item -LiteralPath $installer).Length -eq 0) {
            throw 'The chezmoi installer download was empty.'
          }
          $chezmoi = Join-Path $binDir 'chezmoi.exe'
          $installed = $false
          $maxInstallAttempts = 6
          for ($attempt = 1; $attempt -le $maxInstallAttempts; $attempt++) {
            try {
              & $installer -b $binDir -Tag v2.74.0
              if ($null -ne $LASTEXITCODE -and $LASTEXITCODE -ne 0) {
                throw "chezmoi installer exited with code $LASTEXITCODE."
              }
            } catch {
              Write-Warning "chezmoi install attempt $attempt failed: $_"
            }

            if (Test-Path -LiteralPath $chezmoi -PathType Leaf) {
              try {
                & $chezmoi --version | Out-Null
                if ($LASTEXITCODE -eq 0) {
                  $installed = $true
                  break
                }
              } catch {
                Write-Warning "chezmoi binary check after attempt $attempt failed: $_"
              }
            }

            if ($attempt -lt $maxInstallAttempts) {
              $delay = [Math]::Min(30, 2 * $attempt)
              Write-Warning "chezmoi is not installed yet; retrying in $delay seconds."
              Start-Sleep -Seconds $delay
            }
          }
          if (!$installed) {
            throw "chezmoi was not installed after $maxInstallAttempts attempts."
          }
          $binDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Run configuration merge and environment tests
        run: python -m unittest discover -s scripts/tests -v

  create-failure-issues:
    name: Create failure issues
    runs-on: ubuntu-latest
    if: >-
      ${{
        always() &&
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main'
      }}
    needs:
      - shellcheck
      - yamllint
      - chezmoi-dry-run-linux
      - chezmoi-dry-run-macos
      - chezmoi-dry-run-windows
      - winget-config-validate
      - config-merge-tests
    steps:
      - name: Upsert failure issues
        uses: actions/github-script@v7
        env:
          NEEDS_CONTEXT: ${{ toJson(needs) }}
        with:
          script: |
            const needs = JSON.parse(process.env.NEEDS_CONTEXT);
            const runUrl = [
              context.serverUrl,
              context.repo.owner,
              context.repo.repo,
              'actions',
              'runs',
              context.runId,
            ].join('/');

            const jobs = [
              {
                id: 'shellcheck',
                title: '[ci-failure] lint / shellcheck',
                files: ['.github/workflows/lint.yml', '*.sh'],
                summary: 'Ubuntu の ShellCheck job が失敗しました。',
              },
              {
                id: 'yamllint',
                title: '[ci-failure] lint / yamllint',
                files: ['.github/workflows/lint.yml', '*.yml', '*.yaml'],
                summary: 'Ubuntu の yamllint job が失敗しました。',
              },
              {
                id: 'chezmoi-dry-run-linux',
                title: '[ci-failure] lint / chezmoi dry-run (Linux)',
                files: ['.github/workflows/lint.yml', '.chezmoi.toml.tmpl', 'dot_*', 'private_dot_*'],
                summary: 'Ubuntu の chezmoi dry-run job が失敗しました。',
              },
              {
                id: 'chezmoi-dry-run-macos',
                title: '[ci-failure] lint / chezmoi dry-run (macOS)',
                files: ['.github/workflows/lint.yml', '.chezmoi.toml.tmpl', 'run_once_*', 'dot_*', 'private_dot_*'],
                summary: 'macOS の chezmoi dry-run job が失敗しました。',
              },
              {
                id: 'chezmoi-dry-run-windows',
                title: '[ci-failure] lint / chezmoi dry-run (Windows)',
                files: ['.github/workflows/lint.yml', '.chezmoi.toml.tmpl', 'PowerShell_profile.ps1.tmpl', 'dot_*'],
                summary: 'Windows の chezmoi dry-run job が失敗しました。',
              },
              {
                id: 'winget-config-validate',
                title: '[ci-failure] lint / winget configure validate',
                files: ['.github/workflows/lint.yml', 'reference/windows/configuration.dsc.yaml'],
                summary: 'Windows の winget configure validate job が失敗しました。',
              },
              {
                id: 'config-merge-tests',
                title: '[ci-failure] lint / config merge tests',
                files: [
                  '.github/workflows/lint.yml',
                  'scripts/tests/test_config_merge.py',
                  'scripts/tests/test_dotnet_environment.py',
                  'scripts/tests/test_dotnet_migration.py',
                  'scripts/tests/test_dotnet_migration_flow.py',
                  'scripts/migrate-dotnet-macos.sh',
                  'scripts/migrate-dotnet-macos.ps1',
                  'home/dot_codex/',
                  'home/dot_claude/',
                  'home/.chezmoitemplates/',
                  'home/dot_profile.tmpl',
                  'home/PowerShell_profile.ps1.tmpl',
                  'home/run_after_20-mise-upgrade.sh',
                  'home/run_after_20-mise-upgrade.ps1',
                  'home/run_once_after_20-mise-install.sh',
                  'home/.chezmoiignore',
                  'home/dot_local/bin/executable_dotfiles-dotnet10',
                  'home/dot_local/share/dotfiles/dotnet10-runner/global.json',
                ],
                summary: 'Codex / Claude 設定、macOS 環境、.NET 移行テスト job が失敗しました。',
              },
            ];

            for (const job of jobs) {
              const result = needs[job.id]?.result;
              if (result !== 'failure') {
                continue;
              }

              const body = [
                `<!-- lint-failure:${job.id} -->`,
                '## 概要',
                '',
                `- 対象 job: \`${job.id}\``,
                `- 結果: \`${result}\``,
                `- 実行 run: ${runUrl}`,
                '',
                '## 内容',
                '',
                job.summary,
                '',
                '## 確認対象',
                '',
                ...job.files.map((file) => `- \`${file}\``),
                '',
                '## 対応手順',
                '',
                '1. Actions の該当 run ログを確認する。',
                '2. 関連ファイルを修正する。',
                '3. 修正後に CI が通ることを確認する。',
              ].join('\n');

              const { data: issues } = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                per_page: 100,
              });

              const existing = issues.find((issue) => issue.title === job.title);

              if (existing) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body,
                });
                core.info(`Updated issue #${existing.number}: ${job.title}`);
                continue;
              }

              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: job.title,
                body,
              });

              core.info(`Created issue #${created.data.number}: ${job.title}`);
            }
